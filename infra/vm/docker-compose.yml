# Oracle Cloud Always Free ARM VM (docs/09-v1-schedule.md §3): everything stateful lives here.
#
#   ssh ubuntu@<vm>  →  git clone … && cd careerforge/infra/vm && cp .env.example .env && docker compose up -d
#
# Weeks 1–3: gateway + redis + caddy (TLS). Judge0 joins in week 4 behind the gateway.
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    environment:
      GATEWAY_DOMAIN: ${GATEWAY_DOMAIN:?set GATEWAY_DOMAIN in .env}
    depends_on:
      - gateway

  gateway:
    build:
      context: ../..
      dockerfile: apps/gateway/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 4000
      REDIS_URL: redis://redis:6379
      GIT_SHA: ${GIT_SHA:-dev}
    expose:
      - '4000'
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--maxmemory',
        '256mb',
        '--maxmemory-policy',
        'noeviction',
      ]
    volumes:
      - redis_data:/data

  # Week 4 (docs/05 §4, ADR-010): Judge0 CE on an internal network with no egress.
  # judge0-server: …

volumes:
  caddy_data:
  redis_data:
